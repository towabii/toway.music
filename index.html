<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toway Music</title>
    <!-- モダンなフォントを導入 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --spotify-green: #1DB954;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            background-color: #050505;
        }

        /* アートワークを背景にぼかして配置（Apple Music風） */
        .bg-blur {
            position: fixed;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            object-fit: cover;
            filter: blur(100px) brightness(0.3) saturate(1.5);
            z-index: -1;
            transition: all 1s ease;
        }

        /* スクロールバーのモダン化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* グラスモーフィズム共通 */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        /* ログイン画面 */
        #login-screen {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        #login-screen.hidden { display: none !important; }
        .login-box {
            text-align: center;
            padding: 60px 80px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .login-box h1 { font-size: 3rem; margin-bottom: 5px; font-weight: 700; }
        .login-box p { color: var(--text-sub); margin-bottom: 30px; font-weight: 300; }
        .premium-tag {
            background: rgba(29, 185, 84, 0.2); color: var(--spotify-green);
            padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            display: inline-block; margin-bottom: 20px; border: 1px solid var(--spotify-green);
        }
        #login-btn {
            background: var(--text-main); color: #000;
            border: none; padding: 15px 40px; border-radius: 30px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            transition: transform 0.3s ease, background 0.3s;
        }
        #login-btn:hover { transform: scale(1.05); background: #eee; }

        /* メインアプリ構造 */
        #app-screen {
            display: none; height: 100vh;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 1fr 110px;
            padding: 20px; gap: 20px; box-sizing: border-box;
        }
        #app-screen.active { display: grid; }

        /* サイドバー（履歴エリア） */
        .sidebar {
            grid-row: 1 / 2;
            display: flex; flex-direction: column;
            padding: 20px; overflow: hidden;
        }
        .sidebar-section { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-bottom: 20px; }
        .sidebar-section:last-child { margin-bottom: 0; }
        .sidebar h2 { font-size: 0.9rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 15px; font-weight: 600; }
        
        .history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .history-list li {
            display: flex; align-items: center; padding: 10px;
            border-radius: 12px; cursor: pointer; transition: background 0.2s; gap: 12px;
        }
        .history-list li:hover { background: var(--glass-hover); }
        .history-list img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .track-info-side { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .track-name-side { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name-side { font-size: 0.8rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .time-info { text-align: right; font-size: 0.75rem; color: var(--text-sub); }

        /* メイン画面（アートワーク＆歌詞） */
        .main-content {
            grid-row: 1 / 2; display: flex; gap: 30px; padding: 20px; overflow: hidden;
        }
        .visual-section {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .album-art-large {
            width: 100%; max-width: 450px; aspect-ratio: 1/1;
            object-fit: cover; border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); margin-bottom: 40px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .visual-section:hover .album-art-large { transform: scale(1.03); }
        #track-name { font-size: 2.5rem; font-weight: 700; margin: 0 0 5px 0; text-align: center; }
        #artist-name { font-size: 1.2rem; color: var(--text-sub); font-weight: 400; margin: 0; text-align: center; }

        .lyrics-section {
            flex: 1; padding: 40px; overflow-y: auto; text-align: center;
        }
        #lyrics-text {
            font-size: 1.3rem; line-height: 2.2; color: rgba(255,255,255,0.85); font-weight: 600; white-space: pre-wrap;
        }

        /* プレイヤーバー（下部） */
        .player-bar {
            grid-column: 1 / 3; grid-row: 2 / 3;
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px;
        }
        .player-left { display: flex; align-items: center; width: 30%; gap: 15px; }
        .player-left img { width: 64px; height: 64px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .player-left-info { display: flex; flex-direction: column; }
        #player-track { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        #player-artist { font-size: 0.85rem; color: var(--text-sub); }

        .player-center { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 40%; }
        .controls { display: flex; align-items: center; gap: 30px; margin-bottom: 10px; }
        .control-btn { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; transition: color 0.2s; }
        .control-btn:hover { color: var(--text-main); }
        .play-pause-btn {
            background: var(--text-main); color: #000; width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem;
            border: none; cursor: pointer; transition: transform 0.2s; padding-left: 3px; /* アイコンのズレ補正 */
        }
        .play-pause-btn.playing { padding-left: 0; }
        .play-pause-btn:hover { transform: scale(1.1); }

        /* プログレスバー */
        .progress-container { display: flex; align-items: center; width: 100%; gap: 15px; font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }
        .progress-bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--text-main); width: 0%; border-radius: 3px; transition: width 0.1s linear; }

        .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; }
        .device-info { color: var(--spotify-green); font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <!-- 背景のぼかしアートワーク -->
    <img id="bg-artwork" class="bg-blur" src="" alt="">

    <!-- ログイン画面 -->
    <div id="login-screen">
        <div class="login-box glass">
            <div class="premium-tag">PREMIUM ONLY</div>
            <h1>Toway Music</h1>
            <p>ブラウザだけで完結する、モダンな音楽体験。</p>
            <button id="login-btn"><i class="fab fa-spotify" style="margin-right:8px;"></i> Spotifyでログイン</button>
        </div>
    </div>

    <!-- メインアプリ画面 -->
    <div id="app-screen">
        <!-- サイドバー -->
        <aside class="sidebar glass">
            <!-- ブラウザローカル履歴 -->
            <div class="sidebar-section">
                <h2><i class="fas fa-history"></i> このブラウザの再生履歴</h2>
                <ul id="local-history-list" class="history-list">
                    <div style="text-align:center; padding: 20px; color: var(--text-sub); font-size:0.9rem;">まだ履歴がありません</div>
                </ul>
            </div>
            <!-- Spotify API 履歴 -->
            <div class="sidebar-section">
                <h2><i class="fab fa-spotify"></i> 最近のアクティビティ</h2>
                <ul id="api-history-list" class="history-list">
                    <div style="text-align:center; padding: 20px; color: var(--text-sub); font-size:0.9rem;">読み込み中...</div>
                </ul>
            </div>
        </aside>

        <!-- メイン画面 -->
        <main class="main-content">
            <div class="visual-section">
                <img id="album-art" src="" alt="Album Art" class="album-art-large" style="display: none;">
                <h1 id="track-name">再生を待機中...</h1>
                <h2 id="artist-name">Spotifyで音楽を再生してください</h2>
            </div>
            <div class="lyrics-section glass">
                <h3 style="font-size: 1rem; color: var(--text-sub); margin-top: 0; font-weight:600;"><i class="fas fa-align-center"></i> LYRICS</h3>
                <div id="lyrics-text">曲を再生すると歌詞が表示されます。<br><span style="font-size:0.8rem; color:gray;">(一部の楽曲は未対応です)</span></div>
            </div>
        </main>

        <!-- プレイヤーバー -->
        <footer class="player-bar glass">
            <div class="player-left">
                <img id="player-art" src="https://via.placeholder.com/64" alt="" style="display: none;">
                <div class="player-left-info">
                    <span id="player-track">-</span>
                    <span id="player-artist">-</span>
                </div>
            </div>

            <div class="player-center">
                <div class="controls">
                    <button class="control-btn" id="prev-btn"><i class="fas fa-backward-step"></i></button>
                    <button class="play-pause-btn" id="play-btn"><i class="fas fa-play"></i></button>
                    <button class="control-btn" id="next-btn"><i class="fas fa-forward-step"></i></button>
                </div>
                <!-- シークバー（再生時間） -->
                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <div class="progress-bar-bg" id="progress-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="player-right">
                <div class="device-info"><i class="fas fa-laptop"></i> Toway Web Player</div>
            </div>
        </footer>
    </div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        const CLIENT_ID = '09348ba1442d457cb15867622af1f96a';
        const REDIRECT_URI = 'https://towabii.github.io/toway.music/';
        const SCOPES = [
            'streaming', 'user-read-email', 'user-read-private', 
            'user-read-playback-state', 'user-modify-playback-state', 'user-read-recently-played'
        ];

        let token = null;
        let player = null;
        let deviceId = null;
        let currentTrackId = null;
        let progressInterval = null;

        // ログイン処理
        document.getElementById('login-btn').addEventListener('click', () => {
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES.join(' '))}`;
            window.location.href = authUrl;
        });

        // トークン取得
        const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
            if (item) {
                let parts = item.split('=');
                initial[parts[0]] = decodeURIComponent(parts[1]);
            }
            return initial;
        }, {});
        window.location.hash = '';

        if (hash.access_token) {
            token = hash.access_token;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.add('active');
            
            fetchApiHistory();
            renderLocalHistory();
        }

        // Spotify Web Playback SDK
        window.onSpotifyWebPlaybackSDKReady = () => {
            if (!token) return;

            player = new Spotify.Player({
                name: 'Toway Web Player',
                getOAuthToken: cb => { cb(token); },
                volume: 0.5
            });

            player.addListener('ready', ({ device_id }) => {
                deviceId = device_id;
                transferPlaybackToWebBrowser(device_id);
            });

            player.addListener('player_state_changed', state => {
                if (!state) return;
                const track = state.track_window.current_track;
                const isPlaying = !state.paused;
                
                updateUI(track, isPlaying);
                handleProgress(isPlaying, state.position, track.duration_ms);

                // 曲が変わった時だけローカル履歴に保存
                if (currentTrackId !== track.id) {
                    currentTrackId = track.id;
                    saveToLocalHistory(track);
                    fetchLyrics(track.artists[0].name, track.name);
                }
            });

            player.connect();
        };

        async function transferPlaybackToWebBrowser(device_id) {
            await fetch('https://api.spotify.com/v1/me/player', {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ "device_ids": [device_id], "play": false })
            });
        }

        // UI更新
        function updateUI(track, isPlaying) {
            const imgUrl = track.album.images[0].url;
            
            // 背景とメインアートワーク
            document.getElementById('bg-artwork').src = imgUrl;
            const albumArt = document.getElementById('album-art');
            albumArt.src = imgUrl;
            albumArt.style.display = 'block';

            document.getElementById('track-name').innerText = track.name;
            document.getElementById('artist-name').innerText = track.artists[0].name;
            
            // プレイヤーバー
            const playerArt = document.getElementById('player-art');
            playerArt.src = imgUrl;
            playerArt.style.display = 'block';
            document.getElementById('player-track').innerText = track.name;
            document.getElementById('player-artist').innerText = track.artists[0].name;

            // 再生ボタンのアイコン切り替え
            const playBtn = document.getElementById('play-btn');
            if (isPlaying) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playBtn.classList.add('playing');
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                playBtn.classList.remove('playing');
            }
        }

        // 時間フォーマット (ミリ秒 -> m:ss)
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // シークバーの制御
        function handleProgress(isPlaying, positionMs, durationMs) {
            clearInterval(progressInterval);
            document.getElementById('time-total').innerText = formatTime(durationMs);
            
            let currentPos = positionMs;
            
            const updateBar = () => {
                document.getElementById('time-current').innerText = formatTime(currentPos);
                const percent = (currentPos / durationMs) * 100;
                document.getElementById('progress-fill').style.width = `${percent}%`;
            };
            
            updateBar();

            if (isPlaying) {
                // 1秒ごとにAPIから正確な状態を取得して同期する
                progressInterval = setInterval(() => {
                    player.getCurrentState().then(state => {
                        if (!state) return;
                        currentPos = state.position;
                        updateBar();
                    });
                }, 1000);
            }
        }

        // 歌詞の取得
        async function fetchLyrics(artist, title) {
            const lyricsEl = document.getElementById('lyrics-text');
            lyricsEl.innerText = "歌詞を検索中...";
            try {
                const res = await fetch(`https://api.lyrics.ovh/v1/${artist}/${title}`);
                const data = await res.json();
                lyricsEl.innerText = data.lyrics ? data.lyrics : "歌詞データが見つかりませんでした。";
            } catch (e) {
                lyricsEl.innerText = "歌詞データが見つかりませんでした。";
            }
        }

        // --- ブラウザ専用のローカル再生履歴機能 ---
        function saveToLocalHistory(track) {
            let history = JSON.parse(localStorage.getItem('toway_history') || '[]');
            
            // 最新の曲が同じ場合は重複保存しない
            if (history.length > 0 && history[0].id === track.id) return;

            const record = {
                id: track.id,
                uri: track.uri,
                name: track.name,
                artist: track.artists[0].name,
                image: track.album.images[2].url || track.album.images[0].url,
                duration: track.duration_ms,
                played_at: Date.now() // 再生した日時
            };

            history.unshift(record);
            if (history.length > 30) history.pop(); // 最大30件保存
            
            localStorage.setItem('toway_history', JSON.stringify(history));
            renderLocalHistory();
        }

        function renderLocalHistory() {
            const history = JSON.parse(localStorage.getItem('toway_history') || '[]');
            const list = document.getElementById('local-history-list');
            if (history.length === 0) return;
            
            list.innerHTML = '';
            history.forEach(item => {
                const date = new Date(item.played_at);
                const timeStr = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                const durationStr = formatTime(item.duration);

                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${item.image}" alt="">
                    <div class="track-info-side">
                        <span class="track-name-side">${item.name}</span>
                        <span class="artist-name-side">${item.artist}</span>
                    </div>
                    <div class="time-info">
                        <div>${timeStr}</div>
                        <div style="margin-top:4px;">${durationStr}</div>
                    </div>
                `;
                li.onclick = () => playTrack(item.uri);
                list.appendChild(li);
            });
        }

        // --- Spotify APIからの再生履歴 ---
        async function fetchApiHistory() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=15', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const list = document.getElementById('api-history-list');
                list.innerHTML = '';
                
                data.items.forEach(item => {
                    const track = item.track;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <img src="${track.album.images[2].url}" alt="">
                        <div class="track-info-side">
                            <span class="track-name-side">${track.name}</span>
                            <span class="artist-name-side">${track.artists[0].name}</span>
                        </div>
                    `;
                    li.onclick = () => playTrack(track.uri);
                    list.appendChild(li);
                });
            } catch (e) {
                console.error("API履歴の取得に失敗");
            }
        }

        // 曲を指定して再生
        async function playTrack(uri) {
            if (!deviceId) return;
            await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ uris: [uri] })
            });
        }

        // コントロールボタン処理
        document.getElementById('play-btn').addEventListener('click', () => player && player.togglePlay());
        document.getElementById('next-btn').addEventListener('click', () => player && player.nextTrack());
        document.getElementById('prev-btn').addEventListener('click', () => player && player.previousTrack());

        // シークバーのクリックで再生位置を変更する機能
        document.getElementById('progress-bg').addEventListener('click', function(e) {
            if (!player || !currentTrackId) return;
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            
            player.getCurrentState().then(state => {
                if (!state) return;
                const duration = state.track_window.current_track.duration_ms;
                const seekToMs = Math.floor(duration * percent);
                player.seek(seekToMs);
            });
        });
    </script>
</body>
</html>
