<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toway Music - Premium Web Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-color: #1DB954;
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.07);
            --surface-hover: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --player-height: 90px;
            --sidebar-width: 240px;
            --right-panel-width: 320px;
        }

        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            color: var(--text-main); height: 100vh; overflow: hidden;
            background-color: var(--bg-color); user-select: none;
        }

        /* 背景エフェクト */
        .bg-blur {
            position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
            object-fit: cover; filter: blur(90px) brightness(0.25) saturate(1.2);
            z-index: -1; transition: opacity 1s ease;
        }

        /* スクロールバー */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* ログイン画面 */
        #login-screen {
            display: flex; height: 100vh; justify-content: center; align-items: center; flex-direction: column; z-index: 100;
        }
        #login-screen.hidden { display: none !important; }
        .login-box { text-align: center; padding: 60px; background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid var(--border-color); }
        .login-box h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; }
        #login-btn { background: var(--brand-color); color: #000; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s; margin-top: 20px; }
        #login-btn:hover { transform: scale(1.05); background: #1ed760; }

        /* アプリレイアウト */
        #app-screen {
            display: none; height: 100vh;
            grid-template-columns: var(--sidebar-width) 1fr var(--right-panel-width);
            grid-template-rows: 1fr var(--player-height);
            transition: grid-template-columns 0.3s ease;
        }
        #app-screen.active { display: grid; }
        #app-screen.hide-right { grid-template-columns: var(--sidebar-width) 1fr 0px; }

        /* 左サイドバー */
        .sidebar {
            grid-row: 1 / 2; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 10px;
        }
        .nav-menu { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .nav-menu li {
            padding: 12px 15px; margin-bottom: 5px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 15px; color: var(--text-sub); font-weight: 600; transition: 0.2s;
        }
        .nav-menu li:hover, .nav-menu li.active { color: var(--text-main); background: var(--surface-hover); }
        .nav-menu i { font-size: 1.2rem; width: 24px; text-align: center; }
        
        .sidebar-divider { height: 1px; background: var(--border-color); margin: 10px 15px; }
        .playlists-container { flex: 1; overflow-y: auto; padding: 0 5px; }
        .playlists-container h3 { font-size: 0.8rem; color: var(--text-sub); margin: 10px 10px; text-transform: uppercase; letter-spacing: 1px; }

        /* メインビュー (中央) */
        .main-view {
            grid-row: 1 / 2; overflow-y: auto; padding: 30px; position: relative;
        }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .header-title { font-size: 2rem; font-weight: 700; margin-bottom: 20px; margin-top: 0; }

        /* 検索バー */
        .search-box {
            display: flex; align-items: center; background: var(--surface-color); border-radius: 30px;
            padding: 10px 20px; width: 400px; margin-bottom: 30px; border: 1px solid transparent;
        }
        .search-box:focus-within { border-color: var(--brand-color); background: rgba(255,255,255,0.1); }
        .search-box input { background: transparent; border: none; color: white; font-size: 1rem; width: 100%; outline: none; margin-left: 10px; }

        /* カードリスト & トラックリスト */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--surface-color); padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .card:hover { background: var(--surface-hover); transform: translateY(-5px); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 0.8rem; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .track-list { width: 100%; border-collapse: collapse; text-align: left; }
        .track-list th { color: var(--text-sub); font-size: 0.8rem; font-weight: 400; padding: 10px; border-bottom: 1px solid var(--border-color); text-transform: uppercase; }
        .track-list td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        .track-row { cursor: pointer; transition: background 0.2s; border-radius: 8px; }
        .track-row:hover { background: var(--surface-hover); }
        .track-title-cell { display: flex; align-items: center; gap: 15px; }
        .track-title-cell img { width: 40px; height: 40px; border-radius: 4px; }
        .action-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; padding: 5px; font-size: 1rem; transition: 0.2s; }
        .action-btn:hover { color: var(--text-main); transform: scale(1.1); }

        /* 右パネル (Now Playing) */
        .right-panel {
            grid-row: 1 / 2; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; overflow: hidden; transition: 0.3s;
        }
        #app-screen.hide-right .right-panel { opacity: 0; pointer-events: none; }
        .np-header { padding: 20px; font-weight: 600; font-size: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;}
        .np-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .np-art { width: 100%; aspect-ratio: 1/1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .np-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 5px; }
        .np-artist { font-size: 1rem; color: var(--text-sub); text-align: center; margin-bottom: 25px; }
        
        .artist-img-wrapper { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 25px; position: relative; display: none; }
        .artist-img-wrapper img { width: 100%; height: 160px; object-fit: cover; display: block; filter: brightness(0.7); }
        .artist-img-wrapper span { position: absolute; bottom: 10px; left: 15px; font-weight: 700; }

        .lyrics-box { background: var(--surface-color); border-radius: 12px; padding: 20px; width: 100%; box-sizing: border-box; text-align: center; display: none; }
        .lyrics-box h4 { margin-top: 0; font-size: 0.9rem; color: var(--text-sub); text-transform: uppercase; margin-bottom: 15px; }
        #lyrics-text { font-size: 1.1rem; line-height: 2; font-weight: 500; white-space: pre-wrap; color: rgba(255,255,255,0.9); }

        /* プレイヤー (下部) */
        .player-bar {
            grid-column: 1 / -1; grid-row: 2 / 3; background: rgba(0,0,0,0.8); backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10;
        }
        
        .player-left { display: flex; align-items: center; width: 30%; gap: 15px; }
        .player-left img { width: 56px; height: 56px; border-radius: 8px; }
        .player-info { display: flex; flex-direction: column; overflow: hidden; }
        .p-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-artist { font-size: 0.8rem; color: var(--text-sub); }
        .like-btn { color: var(--text-sub); background: none; border: none; cursor: pointer; font-size: 1.2rem; margin-left: 10px; transition: 0.2s;}
        .like-btn.liked { color: var(--brand-color); }

        .player-center { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .p-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
        .ctrl-btn { background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .ctrl-btn:hover { color: var(--text-main); }
        .ctrl-btn.active { color: var(--brand-color); }
        .play-btn { background: white; color: black; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s; padding-left: 3px;}
        .play-btn.playing { padding-left: 0; }
        .play-btn:hover { transform: scale(1.1); }

        .progress-wrapper { display: flex; align-items: center; width: 100%; gap: 10px; font-size: 0.75rem; color: var(--text-sub); }
        .progress-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: var(--text-main); width: 0%; border-radius: 3px; }
        .progress-bar:hover .progress-fill { background: var(--brand-color); }

        .player-right { display: flex; align-items: center; justify-content: flex-end; width: 30%; gap: 15px; }
        .vol-wrapper { display: flex; align-items: center; gap: 10px; width: 120px; }
        .vol-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; }
        .vol-fill { height: 100%; background: white; width: 50%; border-radius: 3px; }
        .vol-bar:hover .vol-fill { background: var(--brand-color); }
        
        .toggle-panel-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1.2rem; }
        .toggle-panel-btn:hover { color: white; }
    </style>
</head>
<body>
    <img id="bg-blur" class="bg-blur" src="" alt="">

    <div id="login-screen">
        <div class="login-box">
            <h1>Toway Music</h1>
            <p style="color: var(--brand-color); font-weight:bold; margin-bottom: 20px;">Spotify Premium Required</p>
            <p style="color:var(--text-sub);">すべての機能をブラウザで体験しよう</p>
            <button id="login-btn">Spotifyでログイン</button>
        </div>
    </div>

    <div id="app-screen">
        <!-- 左サイドバー -->
        <aside class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item active" data-target="home-view"><i class="fas fa-home"></i> ホーム</li>
                <li class="nav-item" data-target="search-view"><i class="fas fa-search"></i> 検索</li>
                <li class="nav-item" data-target="library-view"><i class="fas fa-heart"></i> お気に入り</li>
                <li class="nav-item" data-target="history-view"><i class="fas fa-history"></i> 履歴</li>
            </ul>
            <div class="sidebar-divider"></div>
            <div class="playlists-container">
                <h3>Playlists</h3>
                <ul class="nav-menu" id="user-playlists" style="font-size: 0.9rem; font-weight:500;">
                    <!-- JSで追加 -->
                </ul>
            </div>
        </aside>

        <!-- メインビュー -->
        <main class="main-view" id="main-scroll">
            <!-- ホーム -->
            <div id="home-view" class="view-section active">
                <h1 class="header-title">おすすめのプレイリスト</h1>
                <div class="card-grid" id="featured-playlists"></div>
                <h1 class="header-title" style="margin-top:40px;">ニューリリース</h1>
                <div class="card-grid" id="new-releases"></div>
            </div>

            <!-- 検索 -->
            <div id="search-view" class="view-section">
                <div class="search-box">
                    <i class="fas fa-search" style="color: var(--text-sub);"></i>
                    <input type="text" id="search-input" placeholder="曲名、アーティスト名で検索...">
                </div>
                <table class="track-list" id="search-results-table" style="display:none;">
                    <thead><tr><th>#</th><th>タイトル</th><th>アルバム</th><th>時間</th><th></th></tr></thead>
                    <tbody id="search-results"></tbody>
                </table>
            </div>

            <!-- ライブラリ(お気に入り) -->
            <div id="library-view" class="view-section">
                <h1 class="header-title">お気に入りの曲</h1>
                <table class="track-list">
                    <thead><tr><th>#</th><th>タイトル</th><th>アルバム</th><th>時間</th><th></th></tr></thead>
                    <tbody id="library-results"></tbody>
                </table>
            </div>

            <!-- 履歴 -->
            <div id="history-view" class="view-section">
                <h1 class="header-title">最近再生した曲</h1>
                <table class="track-list">
                    <thead><tr><th>#</th><th>タイトル</th><th>アルバム</th><th>時間</th><th></th></tr></thead>
                    <tbody id="history-results"></tbody>
                </table>
            </div>

            <!-- 汎用リスト表示用 (プレイリストクリック時) -->
            <div id="list-view" class="view-section">
                <h1 class="header-title" id="list-title">Playlist</h1>
                <table class="track-list">
                    <thead><tr><th>#</th><th>タイトル</th><th>アルバム</th><th>時間</th><th></th></tr></thead>
                    <tbody id="list-results"></tbody>
                </table>
            </div>
        </main>

        <!-- 右パネル (Now Playing) -->
        <aside class="right-panel">
            <div class="np-header">
                <span>Now Playing</span>
                <button class="action-btn" onclick="toggleRightPanel()"><i class="fas fa-times"></i></button>
            </div>
            <div class="np-content">
                <img id="np-art" class="np-art" src="https://via.placeholder.com/400" alt="">
                <div class="np-title" id="np-title">-</div>
                <div class="np-artist" id="np-artist">-</div>
                
                <div class="artist-img-wrapper" id="artist-img-box">
                    <img id="artist-img" src="" alt="">
                    <span>About Artist</span>
                </div>

                <div class="lyrics-box" id="lyrics-box">
                    <h4>Lyrics</h4>
                    <div id="lyrics-text">読み込み中...</div>
                </div>
            </div>
        </aside>

        <!-- プレイヤー -->
        <footer class="player-bar">
            <div class="player-left">
                <img id="p-art" src="https://via.placeholder.com/64" alt="">
                <div class="player-info">
                    <div class="p-title" id="p-title">-</div>
                    <div class="p-artist" id="p-artist">-</div>
                </div>
                <button class="like-btn" id="like-btn" title="お気に入り"><i class="far fa-heart"></i></button>
            </div>

            <div class="player-center">
                <div class="p-controls">
                    <button class="ctrl-btn" id="shuffle-btn" title="シャッフル"><i class="fas fa-random"></i></button>
                    <button class="ctrl-btn" id="prev-btn"><i class="fas fa-backward-step"></i></button>
                    <button class="play-btn" id="play-btn"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn" id="next-btn"><i class="fas fa-forward-step"></i></button>
                    <button class="ctrl-btn" id="repeat-btn" title="リピート"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-wrapper">
                    <span id="time-cur">0:00</span>
                    <div class="progress-bar" id="prog-bar"><div class="progress-fill" id="prog-fill"></div></div>
                    <span id="time-tot">0:00</span>
                </div>
            </div>

            <div class="player-right">
                <button class="ctrl-btn" id="queue-view-btn" title="キューに追加(検索から)"><i class="fas fa-list"></i></button>
                <div class="vol-wrapper">
                    <i class="fas fa-volume-up" style="color:var(--text-sub); font-size:0.9rem;"></i>
                    <div class="vol-bar" id="vol-bar"><div class="vol-fill" id="vol-fill"></div></div>
                </div>
                <button class="toggle-panel-btn" onclick="toggleRightPanel()" title="Now Playingパネル"><i class="fas fa-columns"></i></button>
            </div>
        </footer>
    </div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        // --- 設定 ---
        const CLIENT_ID = '09348ba1442d457cb15867622af1f96a';
        const REDIRECT_URI = 'https://towabii.github.io/toway.music/';
        const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-recently-played user-library-read user-library-modify playlist-read-private playlist-read-collaborative';

        let token = null;
        let player = null;
        let deviceId = null;
        let currentTrackId = null;
        let progInterval = null;

        // --- API ラッパー ---
        async function api(endpoint, method = 'GET', body = null) {
            const options = { method, headers: { 'Authorization': `Bearer ${token}` } };
            if (body) { options.headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(body); }
            const res = await fetch(`https://api.spotify.com/v1${endpoint}`, options);
            if (res.status === 204) return null; // No Content
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            return await res.json();
        }

        // --- 認証 (PKCE) ---
        function genStr(len) {
            const p = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            return Array.from({length: len}, () => p.charAt(Math.floor(Math.random() * p.length))).join('');
        }
        async function genChallenge(v) {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
            return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        document.getElementById('login-btn').onclick = async () => {
            const v = genStr(128);
            localStorage.setItem('cv', v);
            const args = new URLSearchParams({ response_type: 'code', client_id: CLIENT_ID, scope: SCOPES, redirect_uri: REDIRECT_URI, code_challenge_method: 'S256', code_challenge: await genChallenge(v) });
            window.location = 'https://accounts.spotify.com/authorize?' + args;
        };

        const code = new URLSearchParams(window.location.search).get('code');
        if (code) {
            window.history.replaceState({}, document.title, window.location.pathname);
            fetch('https://accounts.spotify.com/api/token', {
                method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, client_id: CLIENT_ID, code_verifier: localStorage.getItem('cv') })
            }).then(r => r.json()).then(d => {
                if (d.access_token) { token = d.access_token; startApp(); }
            });
        }

        // --- アプリ初期化 ---
        async function startApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.add('active');
            
            // データロード
            loadHome();
            loadPlaylists();
        }

        // --- プレイヤー (SDK) ---
        window.onSpotifyWebPlaybackSDKReady = () => {
            if (!token) return;
            player = new Spotify.Player({ name: 'Toway Web Player', getOAuthToken: cb => { cb(token); }, volume: 0.5 });
            
            player.addListener('ready', ({ device_id }) => {
                deviceId = device_id;
                api('/me/player', 'PUT', { device_ids: [device_id], play: false });
            });

            player.addListener('player_state_changed', state => {
                if (!state) return;
                const track = state.track_window.current_track;
                updateUI(track, !state.paused, state.position, track.duration_ms);
                
                if (currentTrackId !== track.id) {
                    currentTrackId = track.id;
                    checkLiked(track.id);
                    fetchExtraInfo(track);
                }
            });
            player.connect();
        };

        // --- コントロールUI更新 ---
        function updateUI(track, isPlaying, pos, dur) {
            const img = track.album.images[0].url;
            document.getElementById('bg-blur').src = img;
            document.getElementById('np-art').src = img;
            document.getElementById('p-art').src = img;
            
            document.getElementById('np-title').innerText = track.name;
            document.getElementById('np-artist').innerText = track.artists[0].name;
            document.getElementById('p-title').innerText = track.name;
            document.getElementById('p-artist').innerText = track.artists[0].name;

            const pb = document.getElementById('play-btn');
            pb.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            isPlaying ? pb.classList.add('playing') : pb.classList.remove('playing');

            // プログレス
            clearInterval(progInterval);
            document.getElementById('time-tot').innerText = fmtTime(dur);
            const updProg = (p) => {
                document.getElementById('time-cur').innerText = fmtTime(p);
                document.getElementById('prog-fill').style.width = `${(p/dur)*100}%`;
            };
            updProg(pos);
            if (isPlaying) {
                progInterval = setInterval(() => { player.getCurrentState().then(s => { if(s) updProg(s.position); }); }, 1000);
            }
        }

        // --- アーティスト画像 & 歌詞 取得 ---
        async function fetchExtraInfo(track) {
            const artistId = track.artists[0].uri.split(':')[2];
            const artistName = track.artists[0].name;
            
            // アーティスト画像
            try {
                const aData = await api(`/artists/${artistId}`);
                if (aData.images.length > 0) {
                    document.getElementById('artist-img').src = aData.images[0].url;
                    document.getElementById('artist-img-box').style.display = 'block';
                } else {
                    document.getElementById('artist-img-box').style.display = 'none';
                }
            } catch(e) { document.getElementById('artist-img-box').style.display = 'none'; }

            // 歌詞
            const lBox = document.getElementById('lyrics-box');
            const lText = document.getElementById('lyrics-text');
            lBox.style.display = 'block';
            lText.innerText = "検索中...";
            try {
                const res = await fetch(`https://api.lyrics.ovh/v1/${artistName}/${track.name}`);
                const d = await res.json();
                if (d.lyrics) lText.innerText = d.lyrics;
                else lBox.style.display = 'none'; // なければ隠す
            } catch(e) { lBox.style.display = 'none'; }
        }

        // --- API操作関数 ---
        async function playUri(uri, context_uri = null) {
            if (!deviceId) return;
            const body = context_uri ? { context_uri } : { uris: [uri] };
            await api(`/me/player/play?device_id=${deviceId}`, 'PUT', body);
        }
        async function addQueue(uri) { await api(`/me/player/queue?uri=${uri}`, 'POST'); alert('キューに追加しました'); }
        
        async function checkLiked(id) {
            const d = await api(`/me/tracks/contains?ids=${id}`);
            const btn = document.getElementById('like-btn');
            if (d[0]) { btn.classList.add('liked'); btn.innerHTML = '<i class="fas fa-heart"></i>'; }
            else { btn.classList.remove('liked'); btn.innerHTML = '<i class="far fa-heart"></i>'; }
        }
        document.getElementById('like-btn').onclick = async () => {
            if(!currentTrackId) return;
            const isLiked = document.getElementById('like-btn').classList.contains('liked');
            await api(`/me/tracks?ids=${currentTrackId}`, isLiked ? 'DELETE' : 'PUT');
            checkLiked(currentTrackId);
        };

        // --- データ取得・レンダリング ---
        async function loadHome() {
            const feat = await api('/browse/featured-playlists?limit=6');
            document.getElementById('featured-playlists').innerHTML = feat.playlists.items.map(p => cardHtml(p)).join('');
            const newR = await api('/browse/new-releases?limit=6');
            document.getElementById('new-releases').innerHTML = newR.albums.items.map(a => cardHtml(a, true)).join('');
        }
        async function loadPlaylists() {
            const p = await api('/me/playlists');
            document.getElementById('user-playlists').innerHTML = p.items.map(i => `<li onclick="loadList('${i.id}','${i.name}')"><i class="fas fa-list-ul"></i> ${i.name}</li>`).join('');
        }
        async function loadLibrary() {
            const d = await api('/me/tracks?limit=30');
            renderTable(d.items.map(i=>i.track), 'library-results');
        }
        async function loadHistory() {
            const d = await api('/me/player/recently-played?limit=30');
            renderTable(d.items.map(i=>i.track), 'history-results');
        }
        async function loadList(id, name) {
            navTo('list-view');
            document.getElementById('list-title').innerText = name;
            const d = await api(`/playlists/${id}/tracks`);
            renderTable(d.items.map(i=>i.track), 'list-results', `spotify:playlist:${id}`);
        }

        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const q = e.target.value;
            if(!q) return document.getElementById('search-results-table').style.display='none';
            searchTimeout = setTimeout(async () => {
                const d = await api(`/search?q=${encodeURIComponent(q)}&type=track&limit=20`);
                document.getElementById('search-results-table').style.display='table';
                renderTable(d.tracks.items, 'search-results');
            }, 500);
        });

        // --- UI部品 ---
        function cardHtml(item, isAlbum=false) {
            return `<div class="card" onclick="playUri('${item.uri}')">
                <img src="${item.images[0].url}">
                <div class="card-title">${item.name}</div>
                <div class="card-desc">${isAlbum ? item.artists[0].name : item.description || 'Playlist'}</div>
            </div>`;
        }
        function renderTable(tracks, targetId, context_uri=null) {
            const tbody = document.getElementById(targetId);
            tbody.innerHTML = tracks.filter(t=>t).map((t, i) => `
                <tr class="track-row">
                    <td onclick="playUri('${t.uri}')">${i+1}</td>
                    <td onclick="playUri('${t.uri}')">
                        <div class="track-title-cell">
                            <img src="${t.album.images[2]?.url || ''}">
                            <div>
                                <div style="font-weight:600; font-size:0.95rem;">${t.name}</div>
                                <div style="font-size:0.8rem; color:var(--text-sub);">${t.artists[0].name}</div>
                            </div>
                        </div>
                    </td>
                    <td onclick="playUri('${t.uri}')" style="color:var(--text-sub); font-size:0.85rem;">${t.album.name}</td>
                    <td onclick="playUri('${t.uri}')" style="color:var(--text-sub); font-size:0.85rem;">${fmtTime(t.duration_ms)}</td>
                    <td><button class="action-btn" onclick="addQueue('${t.uri}')" title="キューに追加"><i class="fas fa-plus"></i></button></td>
                </tr>
            `).join('');
        }
        function fmtTime(ms) { const s = Math.floor(ms/1000); return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

        // --- ナビゲーション ---
        document.querySelectorAll('.nav-item').forEach(el => {
            el.onclick = () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
                navTo(el.dataset.target);
                if(el.dataset.target === 'library-view') loadLibrary();
                if(el.dataset.target === 'history-view') loadHistory();
            };
        });
        function navTo(id) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('main-scroll').scrollTop = 0;
        }

        // --- コントロール操作 ---
        document.getElementById('play-btn').onclick = () => player && player.togglePlay();
        document.getElementById('next-btn').onclick = () => player && player.nextTrack();
        document.getElementById('prev-btn').onclick = () => player && player.previousTrack();
        
        let shuf = false; document.getElementById('shuffle-btn').onclick = (e) => { shuf=!shuf; api(`/me/player/shuffle?state=${shuf}`,'PUT'); e.target.classList.toggle('active'); };
        let rep = 'off'; document.getElementById('repeat-btn').onclick = (e) => { rep=rep==='off'?'track':'off'; api(`/me/player/repeat?state=${rep}`,'PUT'); e.target.classList.toggle('active'); };

        // シーク
        document.getElementById('prog-bar').onclick = function(e) {
            if(!player) return;
            player.getCurrentState().then(s => { if(s) player.seek(Math.floor(s.track_window.current_track.duration_ms * (e.offsetX / this.offsetWidth))); });
        };
        // 音量
        document.getElementById('vol-bar').onclick = function(e) {
            const v = e.offsetX / this.offsetWidth;
            document.getElementById('vol-fill').style.width = `${v*100}%`;
            player.setVolume(v);
        };

        // パネル切り替え
        function toggleRightPanel() { document.getElementById('app-screen').classList.toggle('hide-right'); }
    </script>
</body>
</html>
