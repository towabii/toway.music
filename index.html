<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toway Music</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --spotify-green: #1DB954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Design */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* ログイン画面 */
        #login-screen {
            display: none;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #login-screen.active {
            display: flex;
        }
        .login-box {
            text-align: center;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-box h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .premium-notice {
            color: #ff4d4d;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 30px;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
        }
        #login-btn {
            background: var(--spotify-green);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }
        #login-btn:hover {
            transform: scale(1.05);
            background: #1ed760;
        }

        /* アプリ画面 */
        #app-screen {
            display: none;
            height: 100vh;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 1fr 100px;
            box-sizing: border-box;
            padding: 20px;
            gap: 20px;
        }
        #app-screen.active {
            display: grid;
        }

        /* サイドバー（履歴） */
        .sidebar {
            grid-row: 1 / 2;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sidebar h2 { font-size: 16px; color: var(--text-sub); margin-top: 0; margin-bottom: 20px;}
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar li {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
            cursor: pointer;
        }
        .sidebar li:hover { background: rgba(255,255,255,0.1); }
        .sidebar li img { width: 45px; height: 45px; border-radius: 5px; margin-right: 15px; }
        .track-info-side { display: flex; flex-direction: column; overflow: hidden; }
        .track-name-side { font-size: 14px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .artist-name-side { font-size: 12px; color: var(--text-sub); }

        /* メインコンテンツ（アートワーク＆歌詞） */
        .main-content {
            grid-row: 1 / 2;
            display: flex;
            gap: 30px;
            padding: 20px;
            overflow: hidden;
        }
        .now-playing-visual {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .album-art-large {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        .album-art-large:hover { transform: scale(1.02); }
        .now-playing-visual h1 { font-size: 2rem; margin: 0 0 10px 0; }
        .now-playing-visual h2 { font-size: 1.2rem; color: var(--text-sub); margin: 0; font-weight: normal; }

        .lyrics-section {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            font-size: 20px;
            line-height: 2;
            color: rgba(255,255,255,0.9);
            text-align: center;
        }
        .lyrics-section::-webkit-scrollbar { width: 6px; }
        .lyrics-section::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* 下部プレイヤー */
        .player-bar {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        .player-left { display: flex; align-items: center; width: 30%; }
        .player-left img { width: 60px; height: 60px; border-radius: 8px; margin-right: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .player-left div { display: flex; flex-direction: column; }
        #player-track { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        #player-artist { font-size: 12px; color: var(--text-sub); }

        .player-center { display: flex; align-items: center; justify-content: center; gap: 25px; flex: 1; }
        .control-btn {
            background: none; border: none; color: var(--text-sub); font-size: 20px; cursor: pointer; transition: color 0.2s;
        }
        .control-btn:hover { color: white; }
        .play-pause-btn {
            background: white !important; color: black !important;
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; transition: transform 0.2s;
        }
        .play-pause-btn:hover { transform: scale(1.1); }

        /* Canvas イコライザー */
        .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; }
        #eq-canvas { width: 150px; height: 40px; }
    </style>
</head>
<body>

    <!-- ログイン画面 -->
    <div id="login-screen" class="active">
        <div class="login-box glass">
            <h1>Toway Music</h1>
            <div class="premium-notice">
                <i class="fas fa-exclamation-triangle"></i> このサイトは Spotify Premium 専用です
            </div>
            <p style="margin-bottom: 30px; color: #ccc;">Premiumアカウントでログインすると、<br>ブラウザ上で直接音楽が再生されます。</p>
            <button id="login-btn"><i class="fab fa-spotify"></i> Spotifyでログイン</button>
        </div>
    </div>

    <!-- メインアプリ画面 -->
    <div id="app-screen">
        <!-- サイドバー（履歴） -->
        <aside class="sidebar glass">
            <h2><i class="fas fa-history"></i> 最近再生した曲</h2>
            <ul id="history-list">
                <div style="text-align:center; padding: 20px; color: gray;">読み込み中...</div>
            </ul>
        </aside>

        <!-- メイン画面 -->
        <main class="main-content">
            <div class="now-playing-visual">
                <img id="album-art" src="https://via.placeholder.com/400" alt="Album Art" class="album-art-large">
                <h1 id="track-name">再生を待機中...</h1>
                <h2 id="artist-name">-</h2>
            </div>
            <div class="lyrics-section glass">
                <h3 style="font-size: 16px; color: var(--text-sub); margin-top: 0;"><i class="fas fa-music"></i> Lyrics</h3>
                <div id="lyrics-text">曲を再生すると、ここに歌詞が表示されます。</div>
            </div>
        </main>

        <!-- 下部プレイヤー -->
        <footer class="player-bar glass">
            <div class="player-left">
                <img id="player-art" src="https://via.placeholder.com/60" alt="">
                <div>
                    <span id="player-track">Track Name</span>
                    <span id="player-artist">Artist</span>
                </div>
            </div>

            <div class="player-center">
                <button class="control-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
                <button class="play-pause-btn" id="play-btn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
            </div>

            <div class="player-right">
                <!-- フェイク波形イコライザー -->
                <canvas id="eq-canvas"></canvas>
            </div>
        </footer>
    </div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        const CLIENT_ID = '09348ba1442d457cb15867622af1f96a';
        const REDIRECT_URI = 'https://towabii.github.io/toway.music/';
        const SCOPES = [
            'streaming', 
            'user-read-email', 
            'user-read-private', 
            'user-read-playback-state', 
            'user-modify-playback-state', 
            'user-read-recently-played'
        ];

        let token = null;
        let player = null;
        let deviceId = null;

        // === 認証処理 ===
        document.getElementById('login-btn').addEventListener('click', () => {
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES.join(' '))}`;
            window.location.href = authUrl;
        });

        const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
            if (item) {
                let parts = item.split('=');
                initial[parts[0]] = decodeURIComponent(parts[1]);
            }
            return initial;
        }, {});
        window.location.hash = '';

        if (hash.access_token) {
            token = hash.access_token;
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
            fetchHistory();
        }

        // === Spotify Web Playback SDK の初期化 ===
        window.onSpotifyWebPlaybackSDKReady = () => {
            if (!token) return;

            player = new Spotify.Player({
                name: 'Toway Music Player',
                getOAuthToken: cb => { cb(token); },
                volume: 0.5
            });

            // プレイヤー準備完了時
            player.addListener('ready', ({ device_id }) => {
                console.log('Ready with Device ID', device_id);
                deviceId = device_id;
                // 他のSpotifyアプリがなくても、このブラウザを自動的に再生デバイスとしてアクティブにする
                transferPlaybackToWebBrowser(device_id);
            });

            // 再生状態が変化した時
            player.addListener('player_state_changed', state => {
                if (!state) return;
                const track = state.track_window.current_track;
                updateUI(track, !state.paused);
            });

            player.connect();
        };

        // ブラウザ自体をアクティブデバイスにする処理
        async function transferPlaybackToWebBrowser(device_id) {
            try {
                await fetch('https://api.spotify.com/v1/me/player', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "device_ids": [device_id],
                        "play": false 
                    })
                });
                console.log("Webブラウザをアクティブデバイスに設定しました。");
            } catch (error) {
                console.error("デバイスの転送に失敗しました", error);
            }
        }

        // === UI更新と機能 ===
        function updateUI(track, isPlaying) {
            document.getElementById('track-name').innerText = track.name;
            document.getElementById('artist-name').innerText = track.artists[0].name;
            document.getElementById('album-art').src = track.album.images[0].url;
            
            document.getElementById('player-track').innerText = track.name;
            document.getElementById('player-artist').innerText = track.artists[0].name;
            document.getElementById('player-art').src = track.album.images[0].url;

            const playBtnIcon = document.querySelector('#play-btn i');
            if (isPlaying) {
                playBtnIcon.className = 'fas fa-pause';
                startEqualizer();
            } else {
                playBtnIcon.className = 'fas fa-play';
                stopEqualizer();
            }

            // 歌詞取得（歌詞API）
            fetchLyrics(track.artists[0].name, track.name);
        }

        async function fetchLyrics(artist, title) {
            const lyricsEl = document.getElementById('lyrics-text');
            lyricsEl.innerText = "歌詞を検索中...";
            try {
                const res = await fetch(`https://api.lyrics.ovh/v1/${artist}/${title}`);
                const data = await res.json();
                if (data.lyrics) {
                    lyricsEl.innerText = data.lyrics;
                } else {
                    lyricsEl.innerText = "歌詞データが見つかりませんでした。\n(インストゥルメンタル、または未登録の楽曲)";
                }
            } catch (e) {
                lyricsEl.innerText = "歌詞データが見つかりませんでした。";
            }
        }

        async function fetchHistory() {
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=20', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                
                data.items.forEach(item => {
                    const track = item.track;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <img src="${track.album.images[2].url}" alt="">
                        <div class="track-info-side">
                            <span class="track-name-side">${track.name}</span>
                            <span class="artist-name-side">${track.artists[0].name}</span>
                        </div>
                    `;
                    // 履歴クリックでその曲を再生させる（オマケ機能）
                    li.onclick = () => playTrack(track.uri);
                    list.appendChild(li);
                });
            } catch (e) {
                console.error("履歴の取得に失敗", e);
            }
        }

        async function playTrack(uri) {
            if (!deviceId) return;
            await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ uris: [uri] })
            });
        }

        // コントロールボタン
        document.getElementById('play-btn').addEventListener('click', () => player && player.togglePlay());
        document.getElementById('next-btn').addEventListener('click', () => player && player.nextTrack());
        document.getElementById('prev-btn').addEventListener('click', () => player && player.previousTrack());

        // === Canvas フェイクイコライザー ===
        const canvas = document.getElementById('eq-canvas');
        const ctx = canvas.getContext('2d');
        let eqAnimationId;
        let isEqPlaying = false;

        // 解像度調整
        canvas.width = 150;
        canvas.height = 40;

        function drawEqualizer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const bars = 20;
            const barWidth = 4;
            const gap = 3;
            
            for (let i = 0; i < bars; i++) {
                // 再生中はランダムな高さ、停止時は平ら
                let height = isEqPlaying ? Math.random() * (canvas.height - 10) + 5 : 4;
                let x = i * (barWidth + gap);
                let y = canvas.height - height;
                
                ctx.fillStyle = '#1DB954';
                // 角丸を描画
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, height, 2);
                ctx.fill();
            }

            if (isEqPlaying) {
                // ちょっとコマ落ちさせて本物っぽくする
                setTimeout(() => {
                    eqAnimationId = requestAnimationFrame(drawEqualizer);
                }, 70); 
            }
        }

        function startEqualizer() {
            if (!isEqPlaying) {
                isEqPlaying = true;
                drawEqualizer();
            }
        }

        function stopEqualizer() {
            isEqPlaying = false;
            cancelAnimationFrame(eqAnimationId);
            drawEqualizer(); // 停止状態のバーを描画
        }
        
        // 初期状態描画
        drawEqualizer();

    </script>
</body>
</html>
